kind: test
apiVersion: api.ibm.com/v1
metadata:
  name: tasks-tests
  namespace: tasks-ngw
  version: "1.0"
  tags: []
spec:
  api:
    $ref: tasks-ngw:tasks-api:1.0.0
  environment:
    $ref: tasks-ngw:tasks-ngw-environment:1.0
  request:
    - method: POST
      resource: /tasks
      headers:
        - key: content-type
          value: application/json
        - key: accept
          value: application/json
      auth:
        noauth: true
      payload:
        raw:
          json: |-
            {
                "creator": "Stéphane",
                "assignee": "Fabrice",
                "status": "todo",
                "description": "Arroser les plantes",
                "targetDate": "2026-01-23",
                "comment": "Et pas avec de l'eau de vie !"
            }
      assertions:
        - $ref: tasks-ngw:tasks-create-assertions:1.0
    - method: GET
      resource: /tasks
      headers: []
      auth:
        noauth: true
      assertions:
        - $ref: tasks-ngw:tasks-list-assertions:1.0
