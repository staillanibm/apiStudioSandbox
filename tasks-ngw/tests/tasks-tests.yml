kind: test
apiVersion: api.ibm.com/v1
metadata:
  name: tasks-tests
  namespace: tasks-ngw
  version: "1.0"
  tags: []
spec:
  api:
    $ref: tasks-ngw:tasks-api:1.0.0
  request:
    - method: POST
      resource: /tasks
      headers:
        - key: content-type
          value: application/json
        - key: X-IBM-Client-ID
          value: ${clientId}
        - key: X-IBM-Client-Secret
          value: ${clientSecret}
      auth:
        noauth: true
      assertions:
        - $ref: tasks-ngw:tasks-create-assertions:1.0
      var:
        - key: taskId
          value: responseBody.id
        - key: taskCreator
          value: responseBody.creator
      payload:
        raw:
          json: |-
            {
                "creator": "Stéphane",
                "assignee": "Fabrice",
                "status": "todo",
                "description": "Arroser les plantes",
                "targetDate": "2026-01-31",
                "comment": "Et pas avec de l'eau de vie !"
            }
    #      skipped: true
    - method: GET
      resource: /tasks
      headers:
        - key: X-IBM-Client-ID
          value: ${clientId}
        - key: X-IBM-Client-Secret
          value: ${clientSecret}
      auth: {}
      assertions:
        - $ref: tasks-ngw:tasks-list-assertions:1.0
      var: []
    - method: GET
      resource: /tasks/{taskId}
      headers:
        - key: X-IBM-Client-ID
          value: ${clientId}
        - key: X-IBM-Client-Secret
          value: ${clientSecret}
      auth:
        noauth: true
      assertions:
        - $ref: tasks-ngw:tasks-retrieve-assertions:1.0
      parameters:
        - key: taskId
          value: ${taskId}
  #      skipped: true
  environment:
    $ref: tasks-ngw:tasks-environment:1.0
