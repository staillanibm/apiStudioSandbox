kind: assertion
apiVersion: api.ibm.com/v1
metadata:
  name: tasks-create-assertions
  namespace: tasks-ngw
  version: "1.0"
  tags: []
spec:
  - name: HTTP Status Code
    key: responseStatus
    value: 201
    action: equals
  - name: id is in response
    key: json()
    value: id
    action: haveProperty
  - name: createdAt in response
    key: json()
    value: createdAt
    action: haveProperty
  - name: updatedAt in response
    key: json()
    value: updatedAt
    action: haveProperty
